<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Approval Pending</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap');body{font-family:Poppins,sans-serif;background:#070812;color:#fff}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 20%,rgba(255,94,0,.22),transparent 28%),radial-gradient(circle at 80% 30%,rgba(139,92,246,.20),transparent 30%),linear-gradient(135deg,#06070d,#0d1020 52%,#160b18)}.card{background:linear-gradient(145deg,rgba(24,27,43,.85),rgba(11,13,25,.76));border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(18px)}.brand{font-family:Orbitron,sans-serif;background:linear-gradient(90deg,#ff8a00,#ff2d55,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}</style></head><body><div class="bg"></div><div class="min-h-screen flex items-center justify-center p-4"><div class="card max-w-md w-full rounded-3xl p-7 text-center"><img src="{{logo_url}}" class="w-16 h-16 rounded-full object-cover mx-auto mb-4"><div class="text-5xl">⏳</div><h1 class="brand text-2xl font-bold mt-3">Approval Pending</h1><p class="text-slate-400 text-sm mt-3">Your UTR has been submitted to the Owner. After approval, the plan will be added to your dashboard.</p><div class="mt-5 bg-white/5 border border-white/10 rounded-2xl p-4 text-left text-sm"><p><span class="text-slate-500">Plan:</span> {{purchase.plan.name}}</p><p><span class="text-slate-500">UID:</span> {{purchase.uid}}</p><p><span class="text-slate-500">Region:</span> {{purchase.region}}</p><p><span class="text-slate-500">UTR:</span> {{purchase.utr}}</p></div><a href="{{url_for('panel')}}" class="inline-block mt-6 bg-gradient-to-r from-orange-600 via-pink-500 to-violet-500 px-6 py-3 rounded-xl font-semibold">BACK TO DASHBOARD</a></div></div></body></html>
